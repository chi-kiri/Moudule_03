spring.application.name=patient-management

spring.datasource.url=jdbc:h2:mem:patientdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.com.medical.service=TRACE
logging.level.com.example.patientmanagement.service=TRACE

# Lưu log ra file
logging.file.name=logs/patient_web_service.log

# Mỗi file tối đa 2MB
logging.logback.rollingpolicy.max-file-size=2MB

# File cũ được nén thành .gz
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service.%d{yyyy-MM-dd}.%i.log.gz

# Giữ lịch sử tối đa 7 ngày
logging.logback.rollingpolicy.max-history=7